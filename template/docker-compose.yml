version: "3.8"

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: kyberbot-chromadb
    ports:
      # Loopback only: Chroma has no auth, and a bare "8001:8000" listens on
      # every host interface.
      - "127.0.0.1:8001:8000"
    volumes:
      # chromadb/chroma:latest persists to /data internally (not /chroma/chroma —
      # that was an older image's default and silently changed; see
      # packages/cli/src/brain/chromadb.ts CHROMA_DATA_MOUNT_TARGET for detail).
      - ./data/chromadb:/data
    environment:
      - ANONYMIZED_TELEMETRY=false
      - IS_PERSISTENT=TRUE
    restart: unless-stopped
